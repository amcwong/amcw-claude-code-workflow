<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>[Notebook title]</title>
  <style>
    :root {
      --bg: #f7f4ee;
      --fg: #1b1b18;
      --muted: #5c5852;
      --accent: #b45309;
      --panel: #efebe3;
      --border: #d9d2c5;
      --code: #1b1b18;
      --font-body: "Source Serif 4", Georgia, serif;
      --font-head: "Public Sans", system-ui, sans-serif;
      --font-mono: "IBM Plex Mono", ui-monospace, monospace;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #1a1c24;
        --fg: #e8e4db;
        --muted: #a39e94;
        --accent: #f0a14a;
        --panel: #242733;
        --border: #3a3d4a;
        --code: #e8e4db;
      }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: var(--font-body);
      background: var(--bg);
      color: var(--fg);
      line-height: 1.55;
    }
    .layout { display: grid; grid-template-columns: 16rem 1fr; min-height: 100vh; }
    nav {
      position: sticky; top: 0; height: 100vh; overflow: auto;
      background: var(--panel); border-right: 1px solid var(--border);
      padding: 1.25rem 1rem; font-family: var(--font-head); font-size: 0.9rem;
    }
    nav h1 { font-size: 1rem; margin: 0 0 0.35rem; }
    #progress { color: var(--muted); font-size: 0.8rem; margin-bottom: 1rem; }
    nav a { display: block; color: var(--fg); text-decoration: none; padding: 0.2rem 0; }
    nav a:hover { color: var(--accent); }
    main { max-width: 46rem; padding: 2rem 1.75rem 4rem; }
    h1, h2, h3, h4 { font-family: var(--font-head); }
    .week-block { margin-bottom: 3rem; padding-bottom: 2rem; border-bottom: 1px solid var(--border); }
    figure { margin: 1.25rem 0; }
    figcaption { font-size: 0.85rem; color: var(--muted); }
    svg { max-width: 100%; height: auto; }
    a { color: var(--accent); }
    code, pre { font-family: var(--font-mono); font-size: 0.9em; }
    .self-check { background: var(--panel); border-left: 3px solid var(--accent); padding: 0.75rem 1rem; }
    @media (max-width: 800px) {
      .layout { grid-template-columns: 1fr; }
      nav { position: static; height: auto; }
    }
  </style>
</head>
<body>
  <div class="layout">
    <nav>
      <h1>[Notebook title]</h1>
      <div id="progress"></div>
      <div id="toc"></div>
    </nav>
    <main>
      <div id="weeks">
        <!-- `/course-notes add` appends <section class="week-block" id="week-N"> here, before #glossary. -->
      </div>
      <section id="glossary">
        <h2>Glossary</h2>
        <!-- Refreshed from glossary.md on every add/audit. -->
      </section>
    </main>
  </div>
  <script>
    (function () {
      var weeks = document.querySelectorAll(".week-block");
      var toc = document.getElementById("toc");
      weeks.forEach(function (el, i) {
        var h = el.querySelector("h2");
        var a = document.createElement("a");
        a.href = "#" + el.id;
        a.textContent = h ? h.textContent : ("Week " + (i + 1));
        toc.appendChild(a);
      });
      var expected = document.documentElement.getAttribute("data-expected-weeks") || "";
      var n = weeks.length;
      document.getElementById("progress").textContent =
        expected ? (n + " of " + expected + " weeks logged") : (n + " week" + (n === 1 ? "" : "s") + " logged");
    })();
  </script>
</body>
</html>
